# Non-default host ports on purpose: other local projects already bind 5432/6379.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: naira
      POSTGRES_PASSWORD: naira
      POSTGRES_DB: naira_rails
    ports: ['5441:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U naira']
      interval: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6385:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      retries: 10
